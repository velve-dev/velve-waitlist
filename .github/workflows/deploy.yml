# Builds the image, publishes it to GHCR, then triggers Dokploy.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.dokploy
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
      - name: Verify the image is published
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$SHA"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}')" = "$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest.Digest}}')"
      - name: Trigger Dokploy
        env:
          DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOYMENT_WEBHOOK_URL" ]; then
            echo "The DEPLOYMENT_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 -X POST "$DEPLOYMENT_WEBHOOK_URL")
          case "$status" in
            2??) echo "Dokploy accepted the deployment" ;;
            *) echo "Dokploy answered $status" >&2; exit 1 ;;
          esac
