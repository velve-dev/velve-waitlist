# Builds the image, publishes it, then updates the Scaleway container.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  SCW_REGISTRY: rg.nl-ams.scw.cloud
  SCW_IMAGE: rg.nl-ams.scw.cloud/levo-studio/velve-waitlist
  SCW_REGION: nl-ams

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.dokploy
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.SCW_IMAGE }}:latest
            ${{ env.SCW_IMAGE }}:${{ github.event.workflow_run.head_sha }}
      - name: Verify the image is published
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for image in "$GHCR_IMAGE" "$SCW_IMAGE"; do
            docker buildx imagetools inspect "$image:$SHA"
            test "$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest.Digest}}')" = "$(docker buildx imagetools inspect "$image:$SHA" --format '{{json .Manifest.Digest}}')"
          done
      - name: Update the Scaleway container
        if: vars.SCW_CONTAINER_ID != ''
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
          NEW_IMAGE: ${{ env.SCW_IMAGE }}:${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          api="https://api.scaleway.com/containers/v1/regions/$SCW_REGION/containers/$SCW_CONTAINER_ID"
          curl --fail-with-body --silent --show-error --max-time 30 -X PATCH "$api" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" \
            -d "{\"image\": \"$NEW_IMAGE\"}" >/dev/null
          sleep 10
          attempt=0
          while [ "$attempt" -lt 60 ]; do
            body=$(curl --fail --silent --show-error --max-time 30 "$api" -H "X-Auth-Token: $SCW_SECRET_KEY")
            status=$(printf '%s' "$body" | jq -r '.status')
            image=$(printf '%s' "$body" | jq -r '.image')
            echo "Container status: $status"
            if [ "$status" = "ready" ] && [ "$image" = "$NEW_IMAGE" ]; then
              echo "Scaleway runs the new image"
              exit 0
            fi
            if [ "$status" = "error" ]; then
              echo "Scaleway reports an error, see the container logs" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "Timed out waiting for Scaleway" >&2
          exit 1
